services:
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  
  web:
    build: .
    # command: python manage.py runserver 0.0.0.0:8000
    command: "gunicorn --workers=8 --bind=0.0.0.0:8000 hua_cbms.wsgi:application" 
    restart: unless-stopped
    volumes:
      - ./code/hua_cbms:/code
      - ./code/hua_cbms/static:/code/static
          
    # ports:
    #   - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - AUTH_LDAP_BIND_DN=${AUTH_LDAP_BIND_DN}
      - AUTH_LDAP_BIND_PASSWORD=${AUTH_LDAP_BIND_PASSWORD}
      - AUTH_LDAP_SERVER_URI=${AUTH_LDAP_SERVER_URI}
      - DEBUG=False
      - DUMMY_EMAILS=False
      - RECAPTCHA_PUBLIC_KEY=${RECAPTCHA_PUBLIC_KEY}
      - RECAPTCHA_PRIVATE_KEY=${RECAPTCHA_PRIVATE_KEY}
    depends_on:
      - db
      - redis

  nginx:
    image: nginx
    volumes:
      - ./code/hua_cbms/static:/static
      - ./code/hua_cbms/media:/media
      - ./nginx:/etc/nginx/conf.d
    restart: unless-stopped
    ports: 
      - "30100:30100"
    depends_on:
      - web
#    container_name: faculty-nginx

  redis:
    image: redis:7

  worker:
    build: .
    command: celery -A hua_cbms worker --loglevel=INFO
    volumes:
      - ./code/hua_cbms:/code
      - static:/code/static
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - AUTH_LDAP_BIND_DN=${AUTH_LDAP_BIND_DN}
      - AUTH_LDAP_BIND_PASSWORD=${AUTH_LDAP_BIND_PASSWORD}
      - AUTH_LDAP_SERVER_URI=${AUTH_LDAP_SERVER_URI}
      - DEBUG=False
      - DUMMY_EMAILS=False
      - RECAPTCHA_PUBLIC_KEY=${RECAPTCHA_PUBLIC_KEY}
      - RECAPTCHA_PRIVATE_KEY=${RECAPTCHA_PRIVATE_KEY}
    depends_on:
      - db
      - redis

volumes:
  static:
  media:
