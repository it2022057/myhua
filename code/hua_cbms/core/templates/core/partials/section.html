{% load core_tags %}
{% load i18n %}
<script>
    $(document).ready(function () {
        $('#{{ section_id }}').DataTable({
                "lengthChange": false,
                "searching": false,
                "info": false,
                "paging": false,
            }
        );
    });
</script>


<div class="row">
    <div class="col">
        <h3> {{ section_title }}</h3>
    </div>
</div>
<br>
{% if object %}
    <table id="{{ section_id }}">
        <thead>
        <tr>
            {% for field in fields %}
                <th>
                    {{ headers|get_item:field }}
                </th>
            {% endfor %}
        </tr>
        </thead>
        <tbody>
        <tr>
            {% for field in fields %}
                <td>
                    {{ object|get_attr:field }}
                </td>
            {% endfor %}
        </tr>
        </tbody>
    </table>
{% else %}
    <p> {{ empty_text }}</p>
{% endif %}
